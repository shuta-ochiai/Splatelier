# Builds the Swift package and the iOS app, and checks that the generated Metal kernels match
# their Slang sources. Tests are not run here: most of them need a Metal GPU, which the hosted
# macOS runners do not provide, so run `make test` locally.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slang:
    name: Slang outputs are up to date
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools
          key: slang-${{ runner.os }}-${{ hashFiles('scripts/install_slang.sh') }}
      - run: ./scripts/install_slang.sh
      - run: ./scripts/compile_slang.sh --check

  build:
    name: Build package and iOS app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      # The runner image changes every week or two. A build cache made on an older image is mostly
      # unusable on a newer one (a re-run on a newer image recompiled 326 steps instead of 127), and
      # a cache that hit is never saved again, so the stale one would be restored for good. Putting
      # the image version in the key makes each image get its own cache.
      - id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build the Swift package
        run: swift build
      # The iOS app builds into its own DerivedData, so the .build cache above does not help it. Most
      # of its time is compiling mlx-swift (C++ and Metal), which is the same every run, so keep
      # DerivedData too. Without it that took about 5 minutes of the 6.5 the app build needed.
      - uses: actions/cache@v4
        with:
          path: DerivedData
          key: ios-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('Package.swift') }}
          restore-keys: ios-${{ runner.os }}-
      - name: Build the iOS app for the simulator
        run: |
          xcodebuild build -quiet \
            -project App/Splatelier.xcodeproj \
            -scheme Splatelier \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

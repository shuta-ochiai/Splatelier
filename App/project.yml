name: Splatelier
options:
  developmentLanguage: ja
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

# Debug / Release build the app with every feature. AppStore is Release with the APP_STORE flag,
# which leaves out what the App Store version does not offer yet (`AppFeatures`): the mesh made
# after training, and CAD models in the viewer. Only the "Splatelier App Store" scheme uses it.
configs:
  Debug: debug
  Release: release
  AppStore: release

# The signing xcconfigs (see the target's configFiles). Listed as a folder so that they sit in the
# project navigator; a config file directly in App/ alone ends up in a group outside the tree.
fileGroups:
  - Config

# xcodegen spec. `xcodegen generate` regenerates Splatelier.xcodeproj.
# References the Swift Package itself (../Package.swift) as a local package and
# links the Trainer library product.

packages:
  splatelier:
    path: ..

# Declare the App's shared scheme explicitly. Without it, `xcodegen generate` leaves no shared
# scheme at all, and when Xcode recreates schemes automatically it **picks the local package's CLI
# executable `splatelier` as the run target** → "The executable is not codesigned / not
# of a type CoreDevice recognizes" and it cannot be installed on the device (the CLI is neither an
# app bundle nor a signing target). With a shared scheme in place,
# Splatelier is always selected by default after regeneration.
schemes:
  Splatelier:
    build:
      targets:
        Splatelier: all
    run:
      # Release, because speed and temperature are checked on device (Debug Swift is much slower on the CPU side).
      # The generated .xcscheme is also Release, so keep them aligned so regeneration does not revert to Debug.
      config: Release
    profile:
      config: Release
    archive:
      config: Release
  # The build that goes to the App Store: archive with this scheme (see `configs`). Run and Profile
  # use it too, to try the limited app on a device.
  Splatelier App Store:
    build:
      targets:
        Splatelier: all
    run:
      config: AppStore
    profile:
      config: AppStore
    archive:
      config: AppStore

targets:
  Splatelier:
    type: application
    platform: iOS
    sources:
      - Splatelier
    info:
      path: Splatelier/Info.plist
      properties:
        # Display name shown on the home screen, App Switcher, etc. Takes precedence over CFBundleName
        # ($(PRODUCT_NAME)=Splatelier). Without it, regeneration exposes the internal name.
        CFBundleDisplayName: Splatelier
        # The release version and the build number come from Config/Version.xcconfig, so a new
        # version needs no regeneration; the "Stamp the build" script sets the build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Input is RGB + coarse pose from ARKit. CameraUsageDescription is the text shown in the OS dialog
        # when the ARSession starts. Unified as "Splatelier" to match the display name.
        NSCameraUsageDescription: Splatelier uses the camera with ARKit to reconstruct scenes in 3D.
        # For moving Documents (trained PLYs / logs) in and out via Files.app / iTunes.
        # SplatLibraryView's import / ShareLink export rely on these two.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          # Full-screen background at launch. A near-black charcoal (Assets.xcassets/
          # LaunchBackground.colorset) continuous with the dark UI, preventing a white flash.
          # No logo splash (user request). The app icon carries the brand.
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad takes every orientation: iPadOS requires it for multitasking and resizable windows
        # (UIRequiresFullScreen is deprecated). iPhone stays portrait.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
        # The app uses no encryption beyond what iOS provides, so App Store Connect does not ask
        # about export compliance on each upload.
        ITSAppUsesNonExemptEncryption: false
        # STEP CAD models, added to a capture from the Library ("Add CAD model"). iOS declares no
        # type for them, so the Files picker could not offer them without this.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.iso.step
            UTTypeDescription: STEP CAD model
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - step
                - stp
              public.mime-type:
                - model/step
    # Increased-memory entitlement. On-device training at 1440 × many gaussians (dense seed of
    # hundreds of thousands of points + environment sphere) exceeds the default jetsam limit (~2-3GB)
    # and gets OOM-killed, so com.apple.developer.kernel.increased-memory-limit raises the limit
    # (greatly expanded on 8GB devices). It is a standard entitlement granted automatically by
    # Automatic signing, with no special request needed. xcodegen generates the .entitlements and wires CODE_SIGN_ENTITLEMENTS.
    entitlements:
      path: Splatelier/Splatelier.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    # Config/App.xcconfig includes Config/Version.xcconfig (the release version) and
    # Config/Signing.xcconfig, which includes the git-ignored Config/Local.xcconfig with the team and
    # bundle identifier (copy Config/Local.xcconfig.example). None of these are set under
    # `settings`, which would override the xcconfig.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
      AppStore: Config/App.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # Make the brand cyan (Assets.xcassets/AccentColor.colorset) the default for all tints.
        # This switches .tint / .accentColor / borderedProminent / Toggle / ProgressView from the
        # standard iOS blue to Splatelier's cyan.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        # The "Bundle FlexGlue models" script writes a folder of compiled models whose contents are
        # not known ahead, which the user script sandbox would refuse.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Read by `AppFeatures` (App/Splatelier/AppFeatures.swift).
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
    # Experimental wide-angle loop closure: bundle the FlexGlue models when App/FlexGlueModels holds
    # them (made by scripts/flexglue/export_models.py). They are not in the repository (about 230 MB,
    # and the descriptor's weights are under the DINOv3 License); without them the app builds as
    # usual and does not offer the switch. The packages are compiled here so the app loads them
    # directly, and encrypted when App/FlexGlueModels/flexglue.mlmodelkey (a Core ML model key made
    # in Xcode for the team) is there: the license asks not to invite reverse engineering.
    # The AppStore configuration never bundles them (see `AppFeatures.wideLoopClosure`).
    postCompileScripts:
      - name: Bundle FlexGlue models
        basedOnDependencyAnalysis: false
        script: |
          SRC="$SRCROOT/FlexGlueModels"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/FlexGlue"
          rm -rf "$DST"
          # The App Store version (AppStore configuration) leaves the experimental feature out.
          [ "$CONFIGURATION" = "AppStore" ] && exit 0
          [ -d "$SRC" ] || exit 0
          mkdir -p "$DST"
          KEY="$SRC/flexglue.mlmodelkey"
          for m in "$SRC"/*.mlpackage; do
            if [ -f "$KEY" ]; then
              xcrun coremlcompiler compile "$m" "$DST" --encrypt "$KEY" > /dev/null || exit 1
            else
              xcrun coremlcompiler compile "$m" "$DST" > /dev/null || exit 1
            fi
          done
          cp "$SRC"/*.safetensors "$DST"/
    # The build number is the number of commits up to HEAD, which grows with every merge, so each
    # upload to App Store Connect has a higher one than the last, and a build number leads back to
    # its commit. SplatelierCommit names the commit (+dirty when tracked files had changes);
    # `Splatelier.build` reads both, and a trained PLY's header carries them. Without git (a source
    # archive) the Info.plist keeps Version.xcconfig's placeholder 1 and no commit.
    postBuildScripts:
      - name: Stamp the build
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT"
          COUNT=$(git rev-list --count HEAD 2>/dev/null) || exit 0
          COMMIT=$(git rev-parse --short=12 HEAD)
          git diff --quiet HEAD -- || COMMIT="$COMMIT+dirty"
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $COUNT" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :SplatelierCommit" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SplatelierCommit string $COMMIT" "$PLIST"
    dependencies:
      - package: splatelier
        product: Trainer
      - package: splatelier
        product: Capture
      # Viewer for trained PLYs (imported by TrainingView / SplatLibraryView).
      # Without it, after `xcodegen generate` the app fails to build with
      # "no such module 'SplatViewerKit'".
      - package: splatelier
        product: SplatViewerKit
